# Base local persistente; las pruebas usan una base en memoria independiente.
server:
  port: 8080
spring:
  application:
    name: aquasample-backend
  datasource:
    url: ${AQUASAMPLE_DB_URL:jdbc:h2:file:./data/aquasample}
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false
springdoc:
  swagger-ui:
    path: /swagger-ui.html
